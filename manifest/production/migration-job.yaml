apiVersion: batch/v1
kind: Job
metadata:
  name: faded-parsons-production-db-migrate
  namespace: timed-parsons
  labels:
    app: faded-parsons-production
    component: db-migration
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: faded-parsons-production
        component: db-migration
    spec:
      restartPolicy: Never
      containers:
        - name: db-migrate
          image: quay.io/tike/ohtu-faded-parsons:production
          imagePullPolicy: Always
          command: ["alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: database-credentials
                  key: DATABASE_URL
