<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>All Task Lists - Parsons Code Lab</title>

  <link rel="stylesheet"
        href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
  <link rel="stylesheet"
        href="https://use.fontawesome.com/releases/v5.6.3/css/all.css">

  <link rel="stylesheet" href="/js/main.css">
</head>

<body>

  <nav class="navbar">
    <a href="index.html">
      <img src="/ohtuproj_logo.png" alt="Parsons Code Lab Logo" class="navbar-logo">
    </a>
    <div class="ml-auto d-flex align-items-center">
      <a href="/admin_view"
         class="btn btn-outline-dark btn-sm mr-3">
        Admin Dashboard
      </a>
      <a href="/exerciselist"
         class="btn btn-outline-dark btn-sm mr-3">
        Back to exercise list
      </a>
      <a class="btn btn-outline-dark btn-sm mr-2" id="instructions-btn" href="/instructions">Instructions</a>
      <span class="text-dark">
        <i class="fas fa-user"></i>
        <span id="user-name"></span>
      </span>
      <button class="btn btn-outline-dark btn-sm ml-3" id="logout-btn">Logout</button>
    </div>
  </nav>

  <div class="container py-4">

    <h2 class="mb-4">All Task Lists</h2>
    <p class="text-muted mb-4">Showing all task lists from all teachers.</p>

    <div id="task-lists-container" class="loading-spinner mt-5">
      <div class="spinner-border text-primary" role="status">
        <span class="sr-only">Loading...</span>
      </div>
      <p class="mt-2">Loading task lists...</p>
    </div>

  </div>

  <script type="module" src="/js/all_problemsets.js"></script>

</body>
</html>
