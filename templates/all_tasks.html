<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>Parsons Code Lab</title>
		<link
			rel="stylesheet"
			href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
			integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
			crossorigin="anonymous"
		/>
		<link
			rel="stylesheet"
			href="https://use.fontawesome.com/releases/v5.6.3/css/all.css"
		/>
		<link rel="stylesheet" href="/js-parsons/parsons.css" />
		<link rel="stylesheet" href="/js/main.css" />
	</head>
	<body>
		<nav class="navbar">
			<a href="/">
				<img src="/ohtuproj_logo.png" alt="Parsons Code Lab Logo" class="navbar-logo">
			</a>
			<div class="ml-auto">
				<a
					class="btn btn-outline-dark btn-sm mr-3"
					id="global-stats-btn"
					href="/all-tasks"
					style="display: none"
					>Global Statistics</a
				>
				<a
					class="btn btn-outline-dark btn-sm mr-3"
					id="statics-btn"
					href="/teacher-dashboard"
					>Teacher Dashboard</a
				>
				<a class="btn btn-outline-dark btn-sm mr-2" id="instructions-btn" href="/instructions">Instructions</a>
				<span class="text-dark mr-3"><i class="fas fa-user"></i> <span id="user-name"></span> <span id="user-role" class="badge" style="display: none; margin-left: 8px;"></span></span>
				<button class="btn btn-outline-dark btn-sm" id="logout-btn">Logout</button>
			</div>
		</nav>
		<div class="container py-4">
			<h2 class="mb-4">Global Statistics <span class="badge badge-secondary ml-2" style="font-size: 0.5em; vertical-align: middle;">Anonymous</span></h2>
			<p class="text-muted mb-4">Select an exercise to view global anonymous statistics</p>
			<div id="problems-list" class="loading-spinner">
				<div class="spinner-border text-primary" role="status">
					<span class="sr-only">Loading...</span>
				</div>
				<p class="mt-2">Loading exercises...</p>
			</div>
		</div>
		<script type="module" src="/js/all_tasks.js"></script>
</body>
</html>
