<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>All Task Sets - Parsons Code Lab</title>

  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.3/css/all.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/js/main.css">
  <link rel="stylesheet" href="/js/teacher_dashboard.css">
</head>

<body>

  <nav class="navbar">
    <a href="/teacher-dashboard">
      <img src="/ohtuproj_logo.png" alt="Parsons Code Lab Logo" class="navbar-logo">
    </a>
    <div class="ml-auto d-flex align-items-center">
      <a href="/admin-dashboard" class="btn btn-outline-dark btn-sm mr-3" id="admin-dashboard-btn">
        Admin Dashboard
      </a>
      <a href="/teacher-dashboard" class="text-dark mr-3" style="text-decoration: none;">
        <span id="signed-in-as"><i class="fas fa-user"></i> <span id="user-name"></span> <span id="user-role" class="badge" style="display: none; margin-left: 8px;"></span></span>
      </a>
      <div class="navbar-burger-menu" style="margin-left: 1rem;">
        <button class="navbar-burger-toggle" id="navbar-burger-toggle" aria-label="Toggle menu" aria-expanded="false">
          <i class="fas fa-bars"></i>
        </button>
        <div class="navbar-burger-dropdown" id="navbar-burger-dropdown">
          <a href="/global-statistics" class="navbar-burger-item">
            <i class="fas fa-chart-bar"></i> All Tasks & Global Statistics
          </a>
          <a href="/teacher-dashboard" class="navbar-burger-item">
            <i class="fas fa-chalkboard-teacher"></i> My Dashboard
          </a>
          <a href="/instructions" class="navbar-burger-item">
            <i class="fas fa-info-circle"></i> Instructions
          </a>
          <a href="/teacher/profile" class="navbar-burger-item">
            <i class="fas fa-cog"></i> Profile Settings
          </a>
          <a href="#" class="navbar-burger-item text-danger" id="logout-btn" style="border-top: 1px solid #eee; margin-top: 0.5rem; padding-top: 0.5rem;">
            <i class="fas fa-sign-out-alt"></i> Logout
          </a>
        </div>
      </div>
    </div>
  </nav>

  <div class="page-header">
    <div class="page-title">All Task Sets</div>
    <div class="page-subtitle">Showing all task sets from all teachers</div>
  </div>

  <div class="dashboard-main">

    <div class="top-actions align-items-center justify-content-between mb-3" style="display: flex;">
      <p id="task-set-count-badge" style="display: none; font-size: 0.85rem; font-weight: 700; color: var(--brand-text); background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.4rem 0.8rem; margin: 0; box-shadow: var(--shadow);"></p>
    </div>

    <div class="task-filter-menu mb-4">
      <button class="btn nav-link-btn task-filter-toggle" type="button" id="task-filter-toggle" aria-expanded="false" aria-controls="task-filter-panel">
        <i class="fas fa-filter"></i> Search & Filter
      </button>
      <div class="collapse mt-2" id="task-filter-panel">
        <div class="filter-panel-content" style="background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem; box-shadow: var(--shadow);">
          <div class="form-group mb-3">
            <input type="text" class="form-control" id="task-search" placeholder="Search task sets..." style="border-radius: var(--radius); border-color: var(--border); font-family: var(--font);">
            <small class="form-text text-muted mt-1">Select a field below to search in a specific area</small>
          </div>
          <div class="filter-scopes">
            <label class="filter-scope-label" style="font-weight: 600; color: var(--text);">Search in:</label>
            <div class="scope-checkboxes">
              <div class="custom-control custom-checkbox">
                <input type="checkbox" class="custom-control-input filter-scope" id="scope-title" value="title">
                <label class="custom-control-label" for="scope-title">Title</label>
              </div>
              <div class="custom-control custom-checkbox">
                <input type="checkbox" class="custom-control-input filter-scope" id="scope-teacher" value="teacher">
                <label class="custom-control-label" for="scope-teacher">Teacher</label>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="task-sets-container" class="loading-spinner mt-4">
      <div class="spinner-border text-primary" role="status">
        <span class="sr-only">Loading...</span>
      </div>
      <p class="mt-2">Loading task sets...</p>
    </div>

  </div>

  <script type="module" src="/js/all_tasksets.js"></script>

<footer style="background:#f5f7fa;margin-top:2rem;padding:1rem 0;text-align:center;border-top:1px solid #e1e4e8;">
  <div style="max-width:1000px;margin:0 auto;">
    <a class="footer-btn" href="/privacy-policy" style="margin:0 .5rem .5rem .5rem;padding:.4rem .75rem;border:1px solid #ccc;border-radius:6px;text-decoration:none;display:inline-block;background:#fff;color:#111;">Privacy Policy</a>
    <a class="footer-btn" href="/contact" style="margin:0 .5rem .5rem .5rem;padding:.4rem .75rem;border:1px solid #ccc;border-radius:6px;text-decoration:none;display:inline-block;background:#fff;color:#111;">Contact</a>
    <a class="footer-btn" href="/data-retention-policy" style="margin:0 .5rem .5rem .5rem;padding:.4rem .75rem;border:1px solid #ccc;border-radius:6px;text-decoration:none;display:inline-block;background:#fff;color:#111;">Data retention</a>
  </div>
</footer>
<!-- Footer partial (source): templates/footer.html -->
</body>
</html>
