<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>All Task Sets - Parsons Code Lab</title>

  <link rel="stylesheet"
        href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
  <link rel="stylesheet"
        href="https://use.fontawesome.com/releases/v5.6.3/css/all.css">

  <link rel="stylesheet" href="/js/main.css">
</head>

<body>

  <nav class="navbar">
    <a href="/">
      <img src="/ohtuproj_logo.png" alt="Parsons Code Lab Logo" class="navbar-logo">
    </a>
    <div class="ml-auto d-flex align-items-center">
      <a href="/admin-dashboard"
         class="btn btn-outline-dark btn-sm mr-3">
        Admin Dashboard
      </a>
      <a class="btn btn-outline-dark btn-sm mr-2" id="instructions-btn" href="/instructions">Instructions</a>
      <a href="/teacher-dashboard" class="text-dark mr-3" style="text-decoration: none;">
		   <i class="fas fa-user"></i>
		   <span id="user-name"></span>
		   <span id="user-role" class="badge" style="display: none; margin-left: 8px;"></span>
      </a>
      <button class="btn btn-outline-dark btn-sm ml-3" id="logout-btn">Logout</button>
    </div>
  </nav>

  <div class="container py-4">

    <h2 class="mb-4">All Task Sets</h2>
    <p class="text-muted mb-2">Showing all task sets from all teachers.</p>
    <p id="task-set-count-badge" style="display: none; font-size: 1.1rem; font-weight: 600;" class="mb-4"></p>

    <div class="task-filter-menu mb-4">
      <button class="btn btn-outline-secondary task-filter-toggle" type="button" id="task-filter-toggle" aria-expanded="false" aria-controls="task-filter-panel">
        <i class="fas fa-bars"></i> Search & Filter
      </button>
      <div class="collapse mt-2" id="task-filter-panel">
        <div class="filter-panel-content">
          <div class="form-group mb-3">
            <input type="text" class="form-control" id="task-search" placeholder="Search task sets...">
            <small class="form-text text-muted mt-1">Select a field below to search in a specific area</small>
          </div>
          <div class="filter-scopes">
            <label class="filter-scope-label">Search in:</label>
            <div class="scope-checkboxes">
              <div class="custom-control custom-checkbox">
                <input type="checkbox" class="custom-control-input filter-scope" id="scope-title" value="title">
                <label class="custom-control-label" for="scope-title">Title</label>
              </div>
              <div class="custom-control custom-checkbox">
                <input type="checkbox" class="custom-control-input filter-scope" id="scope-teacher" value="teacher">
                <label class="custom-control-label" for="scope-teacher">Teacher</label>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="task-sets-container" class="loading-spinner mt-5">
      <div class="spinner-border text-primary" role="status">
        <span class="sr-only">Loading...</span>
      </div>
      <p class="mt-2">Loading task sets...</p>
    </div>

  </div>

  <script type="module" src="/js/all_tasksets.js"></script>

<footer style="background:#f5f7fa;margin-top:2rem;padding:1rem 0;text-align:center;border-top:1px solid #e1e4e8;">
  <div style="max-width:1000px;margin:0 auto;">
    <a class="footer-btn" href="/privacy-policy" style="margin:0 .5rem .5rem .5rem;padding:.4rem .75rem;border:1px solid #ccc;border-radius:6px;text-decoration:none;display:inline-block;background:#fff;color:#111;">Privacy Policy</a>
    <a class="footer-btn" href="/contact" style="margin:0 .5rem .5rem .5rem;padding:.4rem .75rem;border:1px solid #ccc;border-radius:6px;text-decoration:none;display:inline-block;background:#fff;color:#111;">Contact</a>
    <a class="footer-btn" href="/data-retention-policy" style="margin:0 .5rem .5rem .5rem;padding:.4rem .75rem;border:1px solid #ccc;border-radius:6px;text-decoration:none;display:inline-block;background:#fff;color:#111;">Data retention</a>
  </div>
</footer>
<!-- Footer partial (source): templates/footer.html -->
</body>
</html>
