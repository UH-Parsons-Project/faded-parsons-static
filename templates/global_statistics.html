<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Parsons Code Lab</title>
		<link
			rel="stylesheet"
			href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
			integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
			crossorigin="anonymous"
		/>
		<link
			rel="stylesheet"
			href="https://use.fontawesome.com/releases/v5.6.3/css/all.css"
		/>
		<link rel="stylesheet" href="/js-parsons/parsons.css" />
		<link rel="stylesheet" href="/js/main.css" />
	</head>
	<body>
		<nav class="navbar">
			<a href="/teacher-dashboard">
				<img src="/ohtuproj_logo.png" alt="Parsons Code Lab Logo" class="navbar-logo">
			</a>
			<div class="ml-auto d-flex align-items-center">
				<a href="/teacher-dashboard" class="text-dark mr-3" style="text-decoration: none;">
				    <i class="fas fa-user"></i>
				    <span id="user-name"></span>
				    <span id="user-role" class="badge" style="display: none; margin-left: 8px;"></span>
				</a>
				<button class="btn btn-outline-dark btn-sm" id="logout-btn">Logout</button>
				<div class="navbar-burger-menu" style="margin-left: 1rem;">
					<button class="navbar-burger-toggle" id="navbar-burger-toggle" aria-label="Toggle menu" aria-expanded="false">
						<i class="fas fa-bars"></i>
					</button>
					<div class="navbar-burger-dropdown" id="navbar-burger-dropdown">
						<a href="/global-statistics" class="navbar-burger-item">
									<i class="fas fa-chart-bar"></i> All Tasks & Global Statistics
						</a>
						<a href="/teacher-dashboard" class="navbar-burger-item">
							<i class="fas fa-chalkboard-teacher"></i> My Dashboard
						</a>
						<a href="/instructions" class="navbar-burger-item">
							<i class="fas fa-info-circle"></i> Instructions
						</a>
						<a href="/teacher/profile" class="navbar-burger-item">
							<i class="fas fa-cog"></i> Profile Settings
						</a>
					</div>
				</div>
			</div>
		</nav>
		<div class="container py-4">
			<h2 class="mb-4">All Tasks & Global Statistics</h2>
			<p class="text-muted mb-2">Select an exercise to view global anonymous statistics</p>
			<p id="task-count-badge" style="display: none; font-size: 1.1rem; font-weight: 600;" class="mb-4"></p>
			<div class="task-filter-menu mb-4">
				<button
					class="btn btn-outline-secondary task-filter-toggle"
					type="button"
					id="task-filter-toggle"
					aria-expanded="false"
					aria-controls="task-filter-panel"
				>
					<i class="fas fa-bars"></i> Search & Filter
				</button>

				<div class="collapse mt-2" id="task-filter-panel">
					<div class="filter-panel-content">
						<div class="form-group mb-3">
							<input type="text" class="form-control" id="task-search" placeholder="Search tasks...">
							<small class="form-text text-muted mt-1">Select fields below to search in specific areas</small>
						</div>

						<div class="filter-scopes">
							<label class="filter-scope-label">Search in:</label>
							<div class="scope-checkboxes">
								<div class="custom-control custom-checkbox">
									<input type="checkbox" class="custom-control-input filter-scope" id="scope-title" value="title">
									<label class="custom-control-label" for="scope-title">Title</label>
								</div>
								<div class="custom-control custom-checkbox">
									<input type="checkbox" class="custom-control-input filter-scope" id="scope-teacher" value="teacher">
									<label class="custom-control-label" for="scope-teacher">Teacher</label>
								</div>
								<div class="custom-control custom-checkbox">
									<input type="checkbox" class="custom-control-input filter-scope" id="scope-type" value="type">
									<label class="custom-control-label" for="scope-type">Type</label>
								</div>
								<div class="custom-control custom-checkbox">
									<input type="checkbox" class="custom-control-input filter-scope" id="scope-my-exercises" value="my-exercises">
									<label class="custom-control-label" for="scope-my-exercises">My exercises</label>
								</div>
								<div class="custom-control custom-checkbox">
									<input type="checkbox" class="custom-control-input filter-scope" id="scope-favorites" value="favorites">
									<label class="custom-control-label" for="scope-favorites">Favorites</label>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
			<div id="problems-list" class="loading-spinner">
				<div class="spinner-border text-primary" role="status">
					<span class="sr-only">Loading...</span>
				</div>
				<p class="mt-2">Loading exercises...</p>
			</div>
		</div>
		<script type="module" src="/js/all_tasks.js"></script>
<footer style="background:#f5f7fa;margin-top:2rem;padding:1rem 0;text-align:center;border-top:1px solid #e1e4e8;">
  <div style="max-width:1000px;margin:0 auto;">
    <a class="footer-btn" href="/privacy-policy" style="margin:0 .5rem .5rem .5rem;padding:.4rem .75rem;border:1px solid #ccc;border-radius:6px;text-decoration:none;display:inline-block;background:#fff;color:#111;">Privacy Policy</a>
    <a class="footer-btn" href="/contact" style="margin:0 .5rem .5rem .5rem;padding:.4rem .75rem;border:1px solid #ccc;border-radius:6px;text-decoration:none;display:inline-block;background:#fff;color:#111;">Contact</a>
    <a class="footer-btn" href="/data-retention-policy" style="margin:0 .5rem .5rem .5rem;padding:.4rem .75rem;border:1px solid #ccc;border-radius:6px;text-decoration:none;display:inline-block;background:#fff;color:#111;">Data retention</a>
  </div>
</footer>
<!-- Footer partial (source): templates/footer.html -->
</body>
</html>
