<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Completion Heatmap — Parsons Code Lab</title>

  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.3/css/all.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/js/task_set_overview.css">
</head>
<body>

  <nav class="navbar">
    <a href="/teacher-dashboard">
      <img src="/ohtuproj_logo.png" alt="Parsons Code Lab Logo" class="navbar-logo">
    </a>
    <div class="ml-auto d-flex align-items-center">
      <a href="#" id="back-to-overview" class="btn btn-outline-dark btn-sm mr-3">
        <i class="fas fa-arrow-left"></i> Task Overview
      </a>
      <a href="/teacher-dashboard" class="text-dark mr-3" style="text-decoration: none;">
	    <i class="fas fa-user"></i>
	    <span id="user-name"></span>
	    <span id="user-role" class="badge" style="display: none; margin-left: 8px;"></span>
	 </a>
      <button class="btn btn-outline-dark btn-sm ml-3" id="logout-btn">Logout</button>
      <div class="navbar-burger-menu" style="margin-left:1rem;">
        <button class="navbar-burger-toggle" id="navbar-burger-toggle" aria-label="Toggle menu" aria-expanded="false">
          <i class="fas fa-bars"></i>
        </button>
        <div class="navbar-burger-dropdown" id="navbar-burger-dropdown">
          <a href="/global-statistics" class="navbar-burger-item">
            <i class="fas fa-chart-bar"></i> All Tasks &amp; Global Statistics
          </a>
          <a href="/teacher-dashboard" class="navbar-burger-item">
            <i class="fas fa-chalkboard-teacher"></i> My Dashboard
          </a>
          <a href="/instructions" class="navbar-burger-item">
            <i class="fas fa-info-circle"></i> Instructions
          </a>
        </div>
      </div>
    </div>
  </nav>

  <div class="page-header">
    <div id="heatmap-header" class="loading-spinner">
      <div class="spinner-border text-primary" role="status">
        <span class="sr-only">Loading...</span>
      </div>
      <p class="mt-2">Loading heatmap…</p>
    </div>
  </div>

  <div class="overview-main" id="heatmap-main" style="display:none;">
    <div class="hm-controls-bar" id="hm-controls"></div>
    <div class="hm-card" id="hm-card">
      <div class="hm-scroll">
        <table class="hm-table" id="hm-table"></table>
      </div>
    </div>
    <div class="hm-legend" id="hm-legend"></div>
  </div>

  <div class="hm-tooltip" id="hm-tooltip"></div>

  <div class="hm-modal-overlay" id="hm-modal-overlay" role="dialog" aria-modal="true" aria-labelledby="hm-modal-title">
    <div class="hm-modal">
      <div class="hm-modal-header">
        <div class="hm-modal-title" id="hm-modal-title"></div>
        <button class="hm-modal-close" id="hm-modal-close" aria-label="Close"><i class="fas fa-times"></i></button>
      </div>
      <div class="hm-modal-body" id="hm-modal-body"></div>
      <div class="hm-modal-footer" id="hm-modal-footer"></div>
    </div>
  </div>

  <script type="module" src="/js/heatmap.js"></script>
<footer style="background:#f5f7fa;margin-top:2rem;padding:1rem 0;text-align:center;border-top:1px solid #e1e4e8;">
  <div style="max-width:1000px;margin:0 auto;">
    <a class="footer-btn" href="/privacy-policy" style="margin:0 .5rem .5rem .5rem;padding:.4rem .75rem;border:1px solid #ccc;border-radius:6px;text-decoration:none;display:inline-block;background:#fff;color:#111;">Privacy Policy</a>
    <a class="footer-btn" href="/contact" style="margin:0 .5rem .5rem .5rem;padding:.4rem .75rem;border:1px solid #ccc;border-radius:6px;text-decoration:none;display:inline-block;background:#fff;color:#111;">Contact</a>
    <a class="footer-btn" href="/data-retention-policy" style="margin:0 .5rem .5rem .5rem;padding:.4rem .75rem;border:1px solid #ccc;border-radius:6px;text-decoration:none;display:inline-block;background:#fff;color:#111;">Data retention</a>
  </div>
</footer>
<!-- Footer partial (source): templates/footer.html -->
</body>
</html>
