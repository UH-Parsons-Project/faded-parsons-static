<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>Parsons Code Lab</title>
		<link
			rel="stylesheet"
			href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
			integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
			crossorigin="anonymous"
		/>
		<link
			rel="stylesheet"
			href="https://use.fontawesome.com/releases/v5.6.3/css/all.css"
		/>
		<link rel="stylesheet" href="/js-parsons/parsons.css" />
		<link rel="stylesheet" href="/js/main.css" />
	</head>
	<body>
		  <nav class="navbar">
    		<img src="/ohtuproj_logo.png" alt="Parsons Code Lab Logo" class="navbar-logo">
			<div class="ml-auto">
				<span class="text-black mr-3"><i class="fas fa-user"></i> <span id="user-name"></span></span>
				<button class="btn btn-outline-dark btn-sm" id="logout-btn">Logout</button>
			</div>
		</nav>
		<div class="container">
			<h1>Problems</h1>
			<div id="problems-list">
				<p>Loading problems…</p>
			</div>
		</div>

		<script type="module">
			import { initSignedInAs } from '/js/auth-ui.js';

			initSignedInAs({ preferNickname: true });

			// Logout button
			document.getElementById('logout-btn').addEventListener('click', async () => {
				await fetch('/api/student_logout', { method: 'POST' });
				localStorage.removeItem('nickname');
				const pathParts = window.location.pathname.split('/');
				const uniqueLinkCode = pathParts[2];
				window.location.href = `/set/${uniqueLinkCode}`;
			});

			// Load problem list for this problemset
			const container = document.getElementById('problems-list');
			const pathParts = window.location.pathname.split('/');
			const uniqueLinkCode = pathParts[2]; // /set/{unique_link_code}/tasks

			function render(list) {
				const ul = document.createElement('ul');
				list.forEach(function (item) {
					const li = document.createElement('li');
					const a = document.createElement('a');
					a.href = `/set/${uniqueLinkCode}/tasks/${item.id}/start`;
					a.textContent = item.title;
					li.appendChild(a);
					ul.appendChild(li);
				});
				container.innerHTML = '';
				container.appendChild(ul);
			}

			if (uniqueLinkCode) {
				// Fetch problems for this problemset
				fetch(`/api/problemsets/${uniqueLinkCode}/tasks`)
					.then(function (resp) {
						if (!resp.ok) throw new Error('Network response not ok');
						return resp.json();
					})
					.then(function (json) {
						render(json);
					})
					.catch(function (error) {
						container.innerHTML = '<p>Unable to load problems.</p>';
						console.error(error);
					});
			} else {
				container.innerHTML = '<p>Problem set not found.</p>';
			}
		</script>
</body>
</html>
