
<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Register - Parsons-code-lab</title>
		<link
			rel="stylesheet"
			href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
			crossorigin="anonymous"
		/>
		<link rel="stylesheet" href="/js-parsons/parsons.css" />
		<link rel="stylesheet" href="/js/main.css" />
	</head>
	<body>
		<nav class="navbar">
			<a href="index.html">
				<img src="/ohtuproj_logo.png" alt="Parsons Code Lab Logo" class="navbar-logo">
			</a>
			<div class="ml-auto">
				<a class="btn btn-outline-dark btn-sm" id="instructions-btn" href="/instructions">Instructions</a>
			</div>
		</nav>

		<main class="container">
			<div class="row justify-content-center register-row">
				<div class="col-md-6">
					<h2 class="mb-4 register-title">Teacher Register</h2>
					<p class="text-danger">
						If you are a student, you can't register here. Your teacher will share a link where you can register before joining the task list.
					</p>
					<div id="alert-placeholder"></div>

					<form id="register-form">
						<div class="form-group">
							<label for="username">Username</label>
							<input type="text" class="form-control" id="username" name="username" maxlength="100" required />
						</div>

						<div class="form-group">
							<label for="email">Email</label>
							<input type="email" class="form-control" id="email" name="email" maxlength="100" required />
						</div>

						<div class="form-group">
							<label for="password">Password</label>
							<input type="password" class="form-control" id="password" name="password" required />
						</div>

						<div class="form-group">
							<label for="password_confirm">Confirm Password</label>
							<input type="password" class="form-control" id="password_confirm" name="password_confirm" required />
						</div>

						<div class="form-group">
							<label for="registration_token">Registration Token</label>
							<input
								type="password"
								class="form-control"
								id="registration_token"
								name="registration_token"
								placeholder="Enter the admin-provided token"
								required
							/>
						</div>

						<button type="submit" class="btn btn-primary">Register</button>
					</form>

					<hr />
					<p>
						Already have an account? <a href="/index.html">Login</a>
					</p>
				</div>
			</div>
		</main>

		<script src="/js/register.js"></script>
	</body>
</html>
