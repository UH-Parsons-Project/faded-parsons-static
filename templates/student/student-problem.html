<!DOCTYPE html>
<!-- Loads the bundle.js module and imports initWidget() from it. -->
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Task Solver - Parsons Code Lab</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
	<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.3/css/all.css">
    <link rel="stylesheet" href="/js-parsons/parsons.css"/>
    <link rel="stylesheet" href="/css/main.css"/>
</head>
<body>
	<nav class="navbar">
		<img src="/ohtuproj_logo.png" alt="Parsons Code Lab Logo" class="navbar-logo">
		<div class="ml-auto d-flex align-items-center">
		<a id="back-to-list" href="#"
			class="btn btn-outline-dark btn-sm mr-3">
			Back to task set
		</a>
		<div class="text-dark mr-3">
			<i class="fas fa-user"></i> <span id="user-name"></span> <span id="user-role" class="badge" style="display: none; margin-left: 8px;"></span>
		</div>
		<div class="navbar-burger-menu" style="margin-left: 1rem;">
          <button class="navbar-burger-toggle" id="navbar-burger-toggle" aria-label="Toggle menu" aria-expanded="false">
            <i class="fas fa-bars"></i>
          </button>
          <div class="navbar-burger-dropdown" id="navbar-burger-dropdown">
            <a href="/student/profile" class="navbar-burger-item" id="profile-link">
              <i class="fas fa-cog"></i> Profile
            </a>
            <a href="#" class="navbar-burger-item text-danger" id="logout-btn" style="border-top: 1px solid #eee; margin-top: 0.5rem; padding-top: 0.5rem;">
              <i class="fas fa-sign-out-alt"></i> Logout
            </a>
          </div>
        </div>
</div>
	</nav>

	<div class="container-fluid px-4 px-xl-5 student-problem-page">
        <div id="problem-wrapper"></div>
    </div>
<!-- jQuery, jQueryUI, and Pyodide are all loaded via CDN. Other dependencies are bundled. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.12.1/jquery-ui.min.js" crossorigin="anonymous"></script>
<script src="/js/lib/jquery.ui.touch-punch.js"></script>
<script src="https://cdn.jsdelivr.net/pyodide/v0.19.0/full/pyodide.js"></script>
<script src="/js-parsons/parsons.js"></script>
<script src="/dist/bundle.js" type="module"></script>


<script src="/js/student/student-problem.js" type="module"></script>

<!-- Inactivity warning modal -->
<div id="inactivity-warning"
     style="display:none; position:fixed; top:0; left:0; width:100%; height:100%;
            background:rgba(0,0,0,0.55); z-index:9999;
            justify-content:center; align-items:center;">
    <div style="background:#fff; padding:2rem; border-radius:8px;
                max-width:420px; width:90%; text-align:center;
                box-shadow:0 4px 24px rgba(0,0,0,0.2);">
        <h4>Are you still there?</h4>
        <p>
            You will be sent back to the exercise list in
            <strong id="inactivity-countdown">5:00</strong>
            unless you click the button below.
        </p>
        <button id="still-here-btn" class="btn btn-primary">I'm still here</button>
    </div>
</div>

{% include 'common/footer.html' %}
</body>
</html>
