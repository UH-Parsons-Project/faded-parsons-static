<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Attempts - Parsons Code Lab</title>

  <link rel="stylesheet"
        href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
  <link rel="stylesheet"
        href="https://use.fontawesome.com/releases/v5.6.3/css/all.css">

  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/student-attempts.css">
  <link rel="stylesheet" href="/css/task-statistics.css">
  <link rel="stylesheet" href="/css/embossed-btn.css?v=4">
</head>

<body>

  <nav class="navbar">
    <a href="/teacher-dashboard">
      <img src="/ohtuproj_logo.png" alt="Parsons Code Lab Logo" class="navbar-logo">
    </a>
    <div class="ml-auto d-flex align-items-center">
      <a href="/teacher-dashboard" class="text-dark mr-3" style="text-decoration: none;">
		    <i class="fas fa-user"></i>
		    <span id="user-name"></span>
		    <span id="user-role" class="badge" style="display: none; margin-left: 8px;"></span>
		</a>

      <div class="navbar-burger-menu" style="margin-left: 1rem;">
        <button class="navbar-burger-toggle" id="navbar-burger-toggle" aria-label="Toggle menu" aria-expanded="false">
          <i class="fas fa-bars"></i>
        </button>
        <div class="navbar-burger-dropdown" id="navbar-burger-dropdown">
          <a href="/global-statistics" class="navbar-burger-item">
            <i class="fas fa-chart-bar"></i> All Tasks & Global Statistics
          </a>
          <a href="/teacher-dashboard" class="navbar-burger-item">
            <i class="fas fa-chalkboard-teacher"></i> My Dashboard
          </a>
          <a href="/instructions" class="navbar-burger-item">
            <i class="fas fa-info-circle"></i> Instructions
          </a>
          <a href="/teacher/profile" class="navbar-burger-item">
            <i class="fas fa-cog"></i> Profile Settings
          </a>
          <a href="#" class="navbar-burger-item text-danger" id="logout-btn" style="border-top: 1px solid #eee; margin-top: 0.5rem; padding-top: 0.5rem;">
            <i class="fas fa-sign-out-alt"></i> Logout
          </a>
        </div>
      </div>
    </div>
  </nav>

  <div class="container py-4">

    <div class="mb-3">
      <a href="#" id="back-btn" class="embossed-btn">
        <i class="fas fa-arrow-left"></i> Back
      </a>
    </div>

    <div id="page-header" class="loading-spinner">
      <div class="spinner-border text-primary" role="status">
        <span class="sr-only">Loading...</span>
      </div>
      <p class="mt-2">Loading student attempts...</p>
    </div>

    <div id="attempts-container" style="display: none;">
      <div class="row">
        <div class="col-lg-4 mb-4 mb-lg-0">
          <div class="card-soft p-3 h-100" id="completion-panel">
            <div class="sa-completion-title">Completion</div>
            <div class="d-flex flex-column align-items-center sa-completion-stack">
              <div class="sa-donut-wrap">
                <svg class="sa-donut-svg" width="220" height="220" viewBox="0 0 160 160" aria-hidden="true">
                  <circle class="sa-arc-track" cx="80" cy="80" r="60" fill="none" stroke-width="14"></circle>
                  <circle class="sa-arc-completed" id="sa-arc-completed" cx="80" cy="80" r="60" fill="none" stroke-width="14" stroke-linecap="round" transform="rotate(-90 80 80)"></circle>
                  <circle class="sa-arc-not-completed" id="sa-arc-not-completed" cx="80" cy="80" r="60" fill="none" stroke-width="14" stroke-linecap="round"></circle>
                  <circle class="sa-arc-not-started" id="sa-arc-not-started" cx="80" cy="80" r="60" fill="none" stroke-width="14" stroke-linecap="round"></circle>
                </svg>
                <div class="sa-donut-center">
                  <div class="sa-donut-percent" id="sa-donut-percent">—</div>
                  <div class="sa-donut-label">COMPLETED</div>
                </div>
              </div>
              <div class="sa-done-ratio" id="sa-done-ratio">—</div>
              <div class="sa-legend">
                <div class="sa-legend-row">
                  <span><span class="sa-dot sa-dot-completed"></span>Completed</span>
                  <strong class="sa-value-completed" id="sa-value-completed">—</strong>
                </div>
                <div class="sa-legend-row">
                  <span><span class="sa-dot" id="sa-dot-not-completed"></span>Not completed</span>
                  <strong id="sa-value-not-completed">—</strong>
                </div>
                <div class="sa-legend-row">
                  <span><span class="sa-dot" id="sa-dot-not-started"></span>Not started</span>
                  <strong id="sa-value-not-started">—</strong>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="col-lg-8">
          <h3 class="mb-3">Tasks in Task Set</h3>
          <div id="attempts-list"></div>
        </div>
      </div>
    </div>

  </div>


  <script src="/js/student/student-attempts.js" type="module"></script>

<footer style="background:#f5f7fa;margin-top:2rem;padding:1rem 0;text-align:center;border-top:1px solid #e1e4e8;">
  <div style="max-width:1000px;margin:0 auto;">
    <a class="footer-btn" href="/privacy-policy" style="margin:0 .5rem .5rem .5rem;padding:.4rem .75rem;border:1px solid #ccc;border-radius:6px;text-decoration:none;display:inline-block;background:#fff;color:#111;">Privacy Policy</a>
    <a class="footer-btn" href="/contact" style="margin:0 .5rem .5rem .5rem;padding:.4rem .75rem;border:1px solid #ccc;border-radius:6px;text-decoration:none;display:inline-block;background:#fff;color:#111;">Contact</a>
  </div>
</footer>
<!-- Footer partial (source): templates/footer.html -->
</body>
</html>
