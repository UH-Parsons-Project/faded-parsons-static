<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student nickname</title>

  <link rel="stylesheet"
        href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
  <link rel="stylesheet"
        href="https://use.fontawesome.com/releases/v5.6.3/css/all.css">

  <link rel="stylesheet" href="/js/main.css">

</head>

<body class="body">

	<nav class="navbar">
    <img src="/ohtuproj_logo.png" alt="Parsons Code Lab Logo" class="navbar-logo">
		<span class="ml-3" style="font-size: 1.2rem; color: #0056b3; border-left: 3px solid #0056b3; padding-left: 1rem;">
			<i class="fas fa-book-reader"></i> <strong>Student Dashboard</strong>
		</span>
		<div class="ml-auto" id="auth-section">
			<form class="form-inline" id="login-form">
				<div id="error-message" class="text-danger mr-2" style="display: none;"></div>
				<input class="form-control mr-2" type="text" id="username" placeholder="Username or email" aria-label="Username or email" required>
				<input class="form-control mr-2" type="password" id="password" placeholder="Password" aria-label="Password" required>
				<button class="btn btn-outline-dark btn-sm mr-2" id="login-btn" type="submit">Login</button>
				<button class="btn btn-outline-dark btn-sm mr-2" id="register-btn" type="button">Register</button>
			</form>
			<div id="user-info" class="text-dark" style="display: none;">
        <span class="mr-3"><i class="fas fa-user"></i> <span id="user-name"></span> <span id="user-role" class="badge" style="display: none; margin-left: 8px;"></span></span>
				<button class="btn btn-success btn-sm mr-2" id="join-btn" style="display: none;">Join Task Set</button>
				<button class="btn btn-outline-dark btn-sm" id="logout-btn">Logout</button>
			</div>
		</div>
	</nav>

  <div class="container text-center mt-5">
    <h1 class="display-4 font-weight-bold">Welcome to Parsons Code Lab!</h1>
    <h2 class="h5 text-muted">Login to join the exercise packet</h2>
  </div>

  <script src="/js/student_index.js" type="module"></script>

<footer style="background:#f5f7fa;margin-top:2rem;padding:1rem 0;text-align:center;border-top:1px solid #e1e4e8;">
  <div style="max-width:1000px;margin:0 auto;">
    <a class="footer-btn" href="/privacy-policy" style="margin:0 .5rem .5rem .5rem;padding:.4rem .75rem;border:1px solid #ccc;border-radius:6px;text-decoration:none;display:inline-block;background:#fff;color:#111;">Privacy Policy</a>
    <a class="footer-btn" href="/contact" style="margin:0 .5rem .5rem .5rem;padding:.4rem .75rem;border:1px solid #ccc;border-radius:6px;text-decoration:none;display:inline-block;background:#fff;color:#111;">Contact</a>
    <a class="footer-btn" href="/data-retention-policy" style="margin:0 .5rem .5rem .5rem;padding:.4rem .75rem;border:1px solid #ccc;border-radius:6px;text-decoration:none;display:inline-block;background:#fff;color:#111;">Data retention</a>
  </div>
</footer>
<!-- Footer partial (source): templates/footer.html -->
</body>
</html>
