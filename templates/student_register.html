
<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Student Register - Parsons-code-lab</title>
		<link
			rel="stylesheet"
			href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
			crossorigin="anonymous"
		/>
		<link rel="stylesheet" href="/js-parsons/parsons.css" />
		<link rel="stylesheet" href="/js/main.css" />
	</head>
	<body>
		<nav class="navbar">
			<a>
				<img src="/ohtuproj_logo.png" alt="Parsons Code Lab Logo" class="navbar-logo">
			</a>
		</nav>

		<main class="container">
			<div class="row justify-content-center register-row">
				<div class="col-md-6">
					<h2 class="mb-4 register-title">Student Register</h2>

					<div id="alert-placeholder"></div>

					<form id="register-form">
						<div class="form-group">
							<label for="username">Username</label>
					<input type="text" class="form-control" id="username" name="username" maxlength="20" required />
						</div>

						<div class="form-group">
							<label for="email">Email</label>
							<input type="email" class="form-control" id="email" name="email" maxlength="100" required />
						</div>

						<div class="form-group">
							<label for="password">Password</label>
							<input type="password" class="form-control" id="password" name="password" required />
						</div>

						<div class="form-group">
							<label for="password_confirm">Confirm Password</label>
							<input type="password" class="form-control" id="password_confirm" name="password_confirm" required />
						</div>

						<button type="submit" class="btn btn-primary">Register</button>
					</form>

					<hr />
					<p id="login-link-container"></p>
				</div>
			</div>
		</main>

		<script src="/js/student_register.js" type="module"></script>
	<footer style="background:#f5f7fa;margin-top:2rem;padding:1rem 0;text-align:center;border-top:1px solid #e1e4e8;">
  <div style="max-width:1000px;margin:0 auto;">
    <a class="footer-btn" href="/privacy-policy" style="margin:0 .5rem .5rem .5rem;padding:.4rem .75rem;border:1px solid #ccc;border-radius:6px;text-decoration:none;display:inline-block;background:#fff;color:#111;">Privacy Policy</a>
    <a class="footer-btn" href="/contact" style="margin:0 .5rem .5rem .5rem;padding:.4rem .75rem;border:1px solid #ccc;border-radius:6px;text-decoration:none;display:inline-block;background:#fff;color:#111;">Contact</a>
    <a class="footer-btn" href="/data-retention-policy" style="margin:0 .5rem .5rem .5rem;padding:.4rem .75rem;border:1px solid #ccc;border-radius:6px;text-decoration:none;display:inline-block;background:#fff;color:#111;">Data retention</a>
  </div>
</footer>
<!-- Footer partial (source): templates/footer.html -->
</body>
</html>
