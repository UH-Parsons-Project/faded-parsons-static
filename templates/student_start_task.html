<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Start Task - Parsons Code Lab</title>

  <link rel="stylesheet"
        href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
  <link rel="stylesheet"
        href="https://use.fontawesome.com/releases/v5.6.3/css/all.css">

  <link rel="stylesheet" href="/css/main.css">

</head>

<body>

  <nav class="navbar">
    <img src="/ohtuproj_logo.png" alt="Parsons Code Lab Logo" class="navbar-logo">
    <div class="ml-auto d-flex align-items-center">
      <a id="back-to-list" href="#"
         class="btn btn-outline-dark btn-sm mr-3">
        Back to task set
      </a>
      <div class="text-dark mr-3">
        <i class="fas fa-user"></i> <span id="user-name"></span> <span id="user-role" class="badge" style="display: none; margin-left: 8px;"></span>
      </div>
      <div class="navbar-burger-menu" style="margin-left: 1rem;">
          <button class="navbar-burger-toggle" id="navbar-burger-toggle" aria-label="Toggle menu" aria-expanded="false">
            <i class="fas fa-bars"></i>
          </button>
          <div class="navbar-burger-dropdown" id="navbar-burger-dropdown">
            <a href="/student/profile" class="navbar-burger-item" id="profile-link">
              <i class="fas fa-cog"></i> Profile
            </a>
            <a href="#" class="navbar-burger-item text-danger" id="logout-btn" style="border-top: 1px solid #eee; margin-top: 0.5rem; padding-top: 0.5rem;">
              <i class="fas fa-sign-out-alt"></i> Logout
            </a>
          </div>
        </div>
</div>
  </nav>
  <main class="container main-nickname">
    <div class="p-4">
    <h2 id="task-instructions" class="section-title mb-3">

    </h2>
		<div class="text-center">
			<div class="alert alert-info d-inline-block" role="alert">
				<i class="fas fa-info-circle mr-2"></i>
				Please only start this task if you have enough time to complete it in one sitting.
			</div>
		</div>
		<div class="text-center">
			<button id="start-btn" class="btn btn-primary btn-lg">Start</button>
		</div>
	</div>
  </main>

  <script type="module" src="/js/student/student-start-task.js"></script>
<footer style="background:#f5f7fa;margin-top:2rem;padding:1rem 0;text-align:center;border-top:1px solid #e1e4e8;">
  <div style="max-width:1000px;margin:0 auto;">
    <a class="footer-btn" href="/privacy-policy" style="margin:0 .5rem .5rem .5rem;padding:.4rem .75rem;border:1px solid #ccc;border-radius:6px;text-decoration:none;display:inline-block;background:#fff;color:#111;">Privacy Policy</a>
    <a class="footer-btn" href="/contact" style="margin:0 .5rem .5rem .5rem;padding:.4rem .75rem;border:1px solid #ccc;border-radius:6px;text-decoration:none;display:inline-block;background:#fff;color:#111;">Contact</a>
    <a class="footer-btn" href="/data-retention-policy" style="margin:0 .5rem .5rem .5rem;padding:.4rem .75rem;border:1px solid #ccc;border-radius:6px;text-decoration:none;display:inline-block;background:#fff;color:#111;">Data retention</a>
  </div>
</footer>
<!-- Footer partial (source): templates/footer.html -->
</body>
