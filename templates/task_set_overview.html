<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Set Overview — Parsons Code Lab</title>

  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.3/css/all.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/js/task_set_overview.css">
</head>

<body>

  <nav class="navbar">
    <a href="/teacher-dashboard">
      <img src="/ohtuproj_logo.png" alt="Parsons Code Lab Logo" class="navbar-logo">
    </a>
    <div class="ml-auto d-flex align-items-center">
      <a href="/teacher-dashboard" class="btn btn-outline-dark btn-sm mr-3">
        <i class="fas fa-arrow-left"></i> My Dashboard
      </a>
      <a href="/teacher-dashboard" class="text-dark mr-3" style="text-decoration: none;">
	    <i class="fas fa-user"></i>
	    <span id="user-name"></span>
	    <span id="user-role" class="badge" style="display: none; margin-left: 8px;"></span>
	</a>
      <button class="btn btn-outline-dark btn-sm ml-3" id="logout-btn">
        Logout
      </button>
      <div class="navbar-burger-menu" style="margin-left: 1rem;">
        <button class="navbar-burger-toggle" id="navbar-burger-toggle" aria-label="Toggle menu" aria-expanded="false">
          <i class="fas fa-bars"></i>
        </button>
        <div class="navbar-burger-dropdown" id="navbar-burger-dropdown">
          <a href="/global-statistics" class="navbar-burger-item">
            <i class="fas fa-chart-bar"></i> All Tasks & Global Statistics
          </a>
          <a href="/teacher-dashboard" class="navbar-burger-item">
            <i class="fas fa-chalkboard-teacher"></i> My Dashboard
          </a>
          <a href="/instructions" class="navbar-burger-item">
            <i class="fas fa-info-circle"></i> Instructions
          </a>
        </div>
      </div>
    </div>
  </nav>

  <div class="page-header">
    <div id="list-header" class="loading-spinner">
      <div class="spinner-border text-primary" role="status">
        <span class="sr-only">Loading...</span>
      </div>
      <p class="mt-2">Loading task set...</p>
    </div>
  </div>

  <div class="overview-main">
    <div id="content-container" style="display: none;">

<div class="statistics-layout">

        <div class="tasks-column">
          <h3 class="mb-3">Tasks</h3>
          <div id="tasks-list"></div>
        </div>

        <div class="right-panel">
          <h3 class="mb-3">Students <span style="font-weight:500;text-transform:none;letter-spacing:0;font-size:.9rem;">(<span id="student-count">—</span>)</span></h3>
          <div id="students-list"></div>
        </div>

      </div>
    </div>
  </div>

  <script type="module" src="/js/task_set_overview.js"></script>

</body>
</html>
