<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Dashboard — Parsons Code Lab</title>

  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.3/css/all.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;0,9..40,800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/js/teacher_dashboard.css">
</head>

<body>

  <nav class="navbar">
    <a href="/teacher-dashboard">
      <img src="/ohtuproj_logo.png" alt="Parsons Code Lab Logo" class="navbar-logo">
    </a>
    <div class="ml-auto d-flex align-items-center">
      <span class="text-dark">
        <span id="signed-in-as"><i class="fas fa-user"></i> <span id="user-name"></span> <span id="user-role" class="badge" style="display: none; margin-left: 8px;"></span></span>
      </span>
      <button class="btn btn-outline-dark btn-sm ml-3" id="logout-btn">
        Logout
      </button>
      <div class="navbar-burger-menu" style="margin-left: 1rem;">
        <button class="navbar-burger-toggle" id="navbar-burger-toggle" aria-label="Toggle menu" aria-expanded="false">
          <i class="fas fa-bars"></i>
        </button>
        <div class="navbar-burger-dropdown" id="navbar-burger-dropdown">
          <a href="/global-statistics" class="navbar-burger-item">
            <i class="fas fa-chart-bar"></i> All Tasks & Global Statistics
          </a>
          <a href="/teacher-dashboard" class="navbar-burger-item">
            <i class="fas fa-chalkboard-teacher"></i> My Dashboard
          </a>
          <a href="/instructions" class="navbar-burger-item">
            <i class="fas fa-info-circle"></i> Instructions
          </a>
        </div>
      </div>
    </div>
  </nav>

  <div class="page-header">
    <div class="page-title">My Dashboard</div>
    <div class="page-subtitle">Select a task set to view its statistics and analytics</div>
  </div>

  <div class="dashboard-main">

    <div class="top-actions">
      <div id="all-sets-button-container" style="display: none;">
        <a href="/admin-dashboard" class="btn btn-primary"><i class="fas fa-shield-alt"></i> Admin Dashboard</a>
      </div>
      <a href="/global-statistics" class="nav-link-btn"><i class="fas fa-chart-bar"></i> Global Statistics</a>
      <a href="/instructions" class="nav-link-btn"><i class="fas fa-info-circle"></i> Instructions</a>
    </div>

    <div id="task-sets-container" class="loading-spinner">
      <div class="spinner-border text-primary" role="status">
        <span class="sr-only">Loading...</span>
      </div>
      <p class="mt-2">Loading task sets...</p>
    </div>

  </div>

  <script type="module" src="/js/teacher_dashboard.js"></script>

</body>
</html>
