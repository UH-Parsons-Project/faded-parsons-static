<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Select Task List - Parsons Code Lab</title>

  <link rel="stylesheet"
        href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
  <link rel="stylesheet"
        href="https://use.fontawesome.com/releases/v5.6.3/css/all.css">

  <link rel="stylesheet" href="/js/main.css">
</head>

<body>

  <nav class="navbar">
    <a href="/">
      <img src="/ohtuproj_logo.png" alt="Parsons Code Lab Logo" class="navbar-logo">
    </a>
    <div class="ml-auto d-flex align-items-center">
      <a href="/all-tasks"
         class="btn btn-outline-dark btn-sm mr-3">
        Exercises
      </a>
      <a class="btn btn-outline-dark btn-sm mr-2" id="instructions-btn" href="/instructions">Instructions</a>
      <span class="text-dark">
        <span id="signed-in-as"><i class="fas fa-user"></i> <span id="user-name"></span> <span id="user-role" class="badge" style="display: none; margin-left: 8px;"></span></span>
      </span>
      <button class="btn btn-outline-dark btn-sm ml-3" id="logout-btn">
        Logout
      </button>
    </div>
  </nav>

  <div class="container py-4">

    <h2 class="mb-4">Select a Task List</h2>
    <p class="text-muted mb-4">Choose a task list to view its statistics and analytics</p>

    <div id="all-sets-button-container" style="display: none; margin-bottom: 1rem;">
        <a href="/admin_view" class="btn btn-primary"><i class="fas fa-shield-alt"></i> Admin Dashboard</a>
    </div>

    <div id="task-lists-container" class="loading-spinner">
      <div class="spinner-border text-primary" role="status">
        <span class="sr-only">Loading...</span>
      </div>
      <p class="mt-2">Loading task lists...</p>
    </div>

  </div>

  <script type="module" src="/js/teacher_dashboard.js"></script>

</body>
</html>
