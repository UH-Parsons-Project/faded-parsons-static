<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teacher Profile - Parsons Code Lab</title>

  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.6.3/css/all.css">
  <link rel="stylesheet" href="/js/main.css">
  <link rel="stylesheet" href="/js/profile.css">
</head>
<body>

  <nav class="navbar">
    <a href="/teacher-dashboard">
      <img src="/ohtuproj_logo.png" alt="Parsons Code Lab Logo" class="navbar-logo">
    </a>
    <div class="ml-auto d-flex align-items-center">
      <a href="/teacher-dashboard" class="btn btn-outline-dark btn-sm mr-3" id="back-to-dashboard" title="Back to Dashboard">
        <i class="fas fa-arrow-left"></i> Back to Dashboard
      </a>
      <a href="/teacher-dashboard" class="text-dark mr-3" style="text-decoration: none;">
        <span id="signed-in-as"><i class="fas fa-user"></i> <span id="user-name"></span> <span id="user-role" class="badge" style="display: none; margin-left: 8px;"></span></span>
      </a>
      <button class="btn btn-outline-dark btn-sm ml-2" id="logout-btn">Logout</button>
      
      <div class="navbar-burger-menu" style="margin-left: 1rem;">
        <button class="navbar-burger-toggle" id="navbar-burger-toggle" aria-label="Toggle menu" aria-expanded="false">
          <i class="fas fa-bars"></i>
        </button>
        <div class="navbar-burger-dropdown" id="navbar-burger-dropdown">
          <a href="/global-statistics" class="navbar-burger-item">
            <i class="fas fa-chart-bar"></i> All Tasks & Global Statistics
          </a>
          <a href="/teacher-dashboard" class="navbar-burger-item">
            <i class="fas fa-chalkboard-teacher"></i> My Dashboard
          </a>
          <a href="/instructions" class="navbar-burger-item">
            <i class="fas fa-info-circle"></i> Instructions
          </a>
          <a href="/teacher/profile" class="navbar-burger-item">
            <i class="fas fa-cog"></i> Profile Settings
          </a>
        </div>
      </div>
    </div>
  </nav>

  <div class="container pt-5 pb-4">

    <div class="row">
      <!-- Left Column: Profile Info and Change Email -->
      <div class="col-lg-6">
        
        <!-- Profile Info Card -->
        <div class="card mb-4">
          <div class="card-body">
            <h2 class="card-title">
              <i class="fas fa-id-card"></i> Profile Info
            </h2>
            <div class="row">
              <div class="col-6 mb-3">
                <div class="info-label">Username</div>
                <div id="profile-username" class="info-value">—</div>
              </div>
              <div class="col-6 mb-3">
                <div class="info-label">Member Since</div>
                <div id="profile-created" class="info-value">—</div>
              </div>
              <div class="col-12">
                <div class="info-label">Email</div>
                <div id="profile-email" class="info-value">—</div>
              </div>
            </div>
          </div>
        </div>

        <!-- Change Email Form -->
        <div class="card mb-4">
          <div class="card-body">
            <h2 class="card-title">
              <i class="fas fa-envelope"></i> Change Email
            </h2>
            <div id="email-alert-placeholder"></div>
            <form id="change-email-form">
              <div class="form-group">
                <label for="new-email" class="font-weight-bold text-secondary">New Email Address</label>
                <input type="email" class="form-control" id="new-email" name="email" maxlength="100" required>
              </div>
              <div class="form-group">
                <label for="email-confirm-password" class="font-weight-bold text-secondary">Current Password</label>
                <input type="password" class="form-control" id="email-confirm-password" name="password" required>
              </div>
              <button type="submit" class="btn btn-primary btn-block">
                Update Email
              </button>
            </form>
          </div>
        </div>

      </div>

      <!-- Right Column: Change Password -->
      <div class="col-lg-6 d-flex flex-column">
        <!-- Change Password Form -->
        <div class="card mb-4 flex-grow-1">
          <div class="card-body d-flex flex-column">
            <h2 class="card-title">
              <i class="fas fa-key"></i> Change Password
            </h2>
            <div id="password-alert-placeholder"></div>
            <form id="change-password-form" class="d-flex flex-column flex-grow-1 justify-content-between">
              <div class="form-group">
                <label for="current-password" class="font-weight-bold text-secondary">Current Password</label>
                <input type="password" class="form-control" id="current-password" name="current_password" required>
              </div>
              <div class="form-group">
                <label for="new-password" class="font-weight-bold text-secondary">New Password</label>
                <input type="password" class="form-control" id="new-password" name="new_password" required>
                <small class="form-text text-muted">Minimum 8 characters.</small>
              </div>
              <div class="form-group">
                <label for="new-password-confirm" class="font-weight-bold text-secondary">Confirm New Password</label>
                <input type="password" class="form-control" id="new-password-confirm" name="new_password_confirm" required>
              </div>
              <button type="submit" class="btn btn-primary btn-block">
                Update Password
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer style="background:#f5f7fa;margin-top:2rem;padding:1rem 0;text-align:center;border-top:1px solid #e1e4e8;">
    <div style="max-width:1000px;margin:0 auto;">
      <a class="footer-btn" href="/privacy-policy" style="margin:0 .5rem .5rem .5rem;padding:.4rem .75rem;border:1px solid #ccc;border-radius:6px;text-decoration:none;display:inline-block;background:#fff;color:#111;">Privacy Policy</a>
      <a class="footer-btn" href="/contact" style="margin:0 .5rem .5rem .5rem;padding:.4rem .75rem;border:1px solid #ccc;border-radius:6px;text-decoration:none;display:inline-block;background:#fff;color:#111;">Contact</a>
      <a class="footer-btn" href="/data-retention-policy" style="margin:0 .5rem .5rem .5rem;padding:.4rem .75rem;border:1px solid #ccc;border-radius:6px;text-decoration:none;display:inline-block;background:#fff;color:#111;">Data retention</a>
    </div>
  </footer>

  <script src="/js/teacher_profile.js" type="module"></script>
</body>
</html>
